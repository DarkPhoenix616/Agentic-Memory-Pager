<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMP Chat</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app" class="app panel-closed">
    <nav class="sidebar" aria-label="Chats">
      <div class="brand"><span class="logo">🧠</span><span class="name">AMP Chat</span></div>
      <button id="new-chat" class="new-chat" type="button">＋ New chat</button>
      <div class="side-label">Chats</div>
      <div id="chats" class="chat-list"></div>
    </nav>

    <section class="chat" aria-label="Chat">
      <header class="chatbar">
        <div class="status">
          <span id="model" class="pill">model…</span>
          <span id="vault-mode" class="pill">memory…</span>
        </div>
        <button id="toggle-panel" class="ghost" type="button" aria-controls="panel" aria-expanded="false">📊 Behind the scenes</button>
      </header>
      <div id="messages" class="messages" aria-live="polite">
        <div id="empty" class="greet">
          <div class="bubble">Hello! 👋 How can I help you today?</div>
        </div>
      </div>
      <div id="notice" class="notice" role="status" hidden></div>
      <div id="error" class="error" role="alert" hidden></div>
      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="Message AMP…"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </section>

    <aside id="panel" class="panel" aria-label="Behind the scenes">
      <div class="panel-head">
        <h2>Behind the scenes</h2>
        <button id="close-panel" class="icon-btn" type="button" aria-label="Close">✕</button>
      </div>

      <div class="card">
        <div class="meter-label"><span>Context window</span><span id="meter-text"></span></div>
        <div class="meter">
          <div id="meter-fill" class="fill"></div>
          <div id="meter-target" class="mark target"></div>
          <div id="meter-trigger" class="mark trigger"></div>
        </div>
        <div id="reclaiming" class="reclaiming" hidden>🗜️ Compacting…</div>
      </div>

      <div class="stats">
        <div class="stat"><span id="stat-compactions">0</span><label>Compactions</label></div>
        <div class="stat"><span id="stat-out">0</span><label>Paged out</label></div>
        <div class="stat"><span id="stat-stored">0</span><label>Stored</label></div>
      </div>

      <details class="card" open>
        <summary>Paged in</summary>
        <div id="paged" class="list-box"></div>
      </details>

      <details class="card" open>
        <summary>Activity</summary>
        <div id="activity" class="list-box"></div>
      </details>

      <details class="card">
        <summary id="vault-title">Vault</summary>
        <div id="vault" class="list-box"></div>
      </details>

      <details class="card">
        <summary>Settings</summary>
        <label class="setting">
          <span>Context window <output id="limit-out"></output></span>
          <input id="limit" type="range" min="1024" max="6144" step="256">
        </label>
        <label class="setting">
          <span>Compact at <output id="threshold-out"></output></span>
          <input id="threshold" type="range" min="50" max="95" step="5">
        </label>
        <label class="setting toggle">
          <input id="background" type="checkbox"> Compact in the background
        </label>
      </details>
    </aside>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
